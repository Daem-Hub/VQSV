<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chơi Game Java J2ME</title>
    <style>
        body {
            background-color: #1c1c1c;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #emulator-container {
            width: 100%;
            max-width: 360px;
            height: 600px;
            border: 2px solid #444;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h3>Game Java J2ME HTML5 Player</h3>

    <div id="emulator-container">
        <iframe id="game-frame" src=""></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Lấy link file game của bạn dựa trên đường dẫn hiện tại của web
            // Ví dụ: https://daem-hub.github.io/ten-repo/game.jar
            const currentUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
            const jarUrl = currentUrl + "/game.jar";

            // Sử dụng bộ web emulator chạy trên nền tảng đám mây ổn định
            const emulatorEmbedUrl = `https://emufox.com/embed/j2me/?url=${encodeURIComponent(jarUrl)}`;
            
            // Nạp game vào khung chạy
            document.getElementById("game-frame").src = emulatorEmbedUrl;
        });
    </script>
</body>
</html>
