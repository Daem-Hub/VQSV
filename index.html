<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Java Game J2ME HTML5 Player</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        #screen-container {
            width: 240px; /* Độ phân giải chuẩn game Java cũ */
            height: 320px;
            background: #000;
            margin: 10px auto;
            border: 4px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated; /* Giữ nét đồ họa pixel cũ không bị mờ */
        }
        /* Giao diện bàn phím ảo */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        .key {
            width: 60px;
            height: 45px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }
        .key:active {
            background: #555;
        }
        .control-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }
    </style>
   <script src="https://cdn.jsdelivr.net/gh/replit/js2me@master/dist/js2me.min.js">
</script>
</head>
<body>

    <h3>Đang chạy: Game Java Offline</h3>

    <div id="screen-container">
        <canvas id="canvas"></canvas>
    </div>

    <div class="control-group">
        <div class="key" onclick="sendKey('SOFT1')">L-Soft</div>
        <div class="key" onclick="sendKey('UP')">▲</div>
        <div class="key" onclick="sendKey('SOFT2')">R-Soft</div>
    </div>
    <div class="control-group">
        <div class="key" onclick="sendKey('LEFT')">◀</div>
        <div class="key" onclick="sendKey('FIRE')">OK</div>
        <div class="key" onclick="sendKey('RIGHT')">▶</div>
    </div>
    <div class="control-group">
        <div class="key" onclick="sendKey('DOWN')">▼</div>
    </div>

    <div class="keypad">
        <div class="key" onclick="sendKey('1')">1</div>
        <div class="key" onclick="sendKey('2')">2</div>
        <div class="key" onclick="sendKey('3')">3</div>
        <div class="key" onclick="sendKey('4')">4</div>
        <div class="key" onclick="sendKey('5')">5</div>
        <div class="key" onclick="sendKey('6')">6</div>
        <div class="key" onclick="sendKey('7')">7</div>
        <div class="key" onclick="sendKey('8')">8</div>
        <div class="key" onclick="sendKey('9')">9</div>
        <div class="key" onclick="sendKey('*')">*</div>
        <div class="key" onclick="sendKey('0')">0</div>
        <div class="key" onclick="sendKey('#')">#</div>
    </div>

    <script>
       // Cấu hình nạp file game Java của bạn
const jarUrl = "game.jar"; 

document.addEventListener("DOMContentLoaded", function() {
    // Khởi tạo trình giả lập
    // Thư viện tự động tìm thẻ <canvas id="canvas"> để vẽ game
    if (typeof J2ME !== 'undefined') {
        J2ME.init({
            baseUrl: "./"
        });
        J2ME.launch(jarUrl);
        console.log("Đang tải game...");
    } else {
        alert("Không thể tải bộ giả lập. Vui lòng kiểm tra lại kết nối mạng!");
    }
});

// Hàm xử lý khi người chơi bấm nút ảo trên màn hình
function sendKey(key) {
    if (typeof J2ME !== 'undefined') {
        J2ME.input.pressKey(key);
    }
}
    </script>
</body>
</html>
